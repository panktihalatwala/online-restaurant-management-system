<section class="catering-section">
  <h2>Catering Request Form</h2>
  <p>
    Plan your event with <strong>Indian Affair</strong>!  
    Fill out the form below and our team will contact you shortly.
  </p>

  <form class="catering-form">
    <label>Full Name</label>
    <input type="text" required>

    <label>Email</label>
    <input type="email" required>

    <label>Phone Number</label>
    <input type="tel" required>

    <label>Event Type</label>
    <select>
      <option>Wedding</option>
      <option>Birthday</option>
      <option>Corporate Event</option>
      <option>Party / Gathering</option>
      <option>Other</option>
    </select>

    <label>Number of Guests</label>
    <input type="number" required>

    <label>Menu Preferences / Special Requests</label>
    <textarea rows="5" placeholder="Mention dishes, dietary preferences, etc."></textarea>

    <button type="submit">Submit Request</button>
  </form>
</section>
